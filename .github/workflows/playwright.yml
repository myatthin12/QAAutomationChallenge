name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Falls back to the public challenge account when no secrets are set.
      BASE_URL: ${{ vars.BASE_URL || 'https://www.demoblaze.com' }}
      DEMOBLAZE_USERNAME: ${{ secrets.DEMOBLAZE_USERNAME || 'ChallengeUser' }}
      DEMOBLAZE_PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD || 'ChallengeUser' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
